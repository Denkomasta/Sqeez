<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sqeez</title>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('ui-theme') || 'system';
          const root = document.documentElement;

          const darkThemes = ["dark"]; 
          
          const prefersDarkOS = window.matchMedia('(prefers-color-scheme: dark)').matches;

          const activeDaisyTheme = theme === 'system' ? (prefersDarkOS ? 'dark' : 'light') : theme;

          root.setAttribute('data-theme', activeDaisyTheme);
          
          if (darkThemes.includes(activeDaisyTheme)) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
        } catch (e) {
          console.error("Theme initialization failed", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
