openapi: 3.1.1
info:
  title: Sqeez.Api | v1
  version: 1.0.0
servers:
  - url: http://localhost:5000/
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: POST /api/auth/register
      description: Registers a new public account and sends an email verification link.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDTO"
          text/json:
            schema:
              $ref: "#/components/schemas/RegisterDTO"
          application/*+json:
            schema:
              $ref: "#/components/schemas/RegisterDTO"
        required: true
      responses:
        "200":
          description: OK
  /api/auth/verify-email:
    post:
      tags:
        - Auth
      summary: POST /api/auth/verify-email
      description: Verifies a pending email token, activates the account, and starts
        an authenticated session.
      parameters:
        - name: token
          in: query
          schema:
            type: string
        - name: rememberMe
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
  /api/auth/resend-verification:
    post:
      tags:
        - Auth
      summary: POST /api/auth/resend-verification
      description: Resends a verification link without revealing whether the email
        belongs to an account.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationDto"
          text/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationDto"
          application/*+json:
            schema:
              $ref: "#/components/schemas/ResendVerificationDto"
        required: true
      responses:
        "200":
          description: OK
  /api/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: POST /api/auth/forgot-password
      description: Starts the password-reset flow without revealing whether the email
        belongs to an account.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordDto"
          text/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordDto"
          application/*+json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordDto"
        required: true
      responses:
        "200":
          description: OK
  /api/auth/reset-password:
    post:
      tags:
        - Auth
      summary: POST /api/auth/reset-password
      description: Completes the password-reset flow using a valid reset token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordDto"
          text/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordDto"
          application/*+json:
            schema:
              $ref: "#/components/schemas/ResetPasswordDto"
        required: true
      responses:
        "200":
          description: OK
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: POST /api/auth/login
      description: Authenticates a verified account and stores access and refresh
        tokens in HTTP-only cookies.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDTO"
          text/json:
            schema:
              $ref: "#/components/schemas/LoginDTO"
          application/*+json:
            schema:
              $ref: "#/components/schemas/LoginDTO"
        required: true
      responses:
        "200":
          description: OK
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: POST /api/auth/refresh
      description: Rotates the refresh-token session and issues a fresh cookie pair.
      responses:
        "200":
          description: OK
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: POST /api/auth/logout
      description: Revokes the current refresh-token session and clears authentication
        cookies.
      responses:
        "200":
          description: OK
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: GET /api/auth/me
      description: Returns the currently authenticated user's lightweight profile.
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UserDTO"
            application/json:
              schema:
                $ref: "#/components/schemas/UserDTO"
            text/json:
              schema:
                $ref: "#/components/schemas/UserDTO"
  /api/auth/elevate:
    patch:
      tags:
        - Auth
      summary: PATCH /api/auth/elevate
      description: Updates a user's role and role-specific metadata. Admin-only.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleDTO"
          text/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleDTO"
          application/*+json:
            schema:
              $ref: "#/components/schemas/UpdateRoleDTO"
        required: true
      responses:
        "200":
          description: OK
  /api/badges:
    post:
      tags:
        - Badges
      summary: POST /api/badges
      description: Creates a badge with optional icon upload and rule definitions.
        Admin-only.
      requestBody:
        description: Rules that must be satisfied before the badge can be awarded.
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                Name:
                  maxLength: 150
                  minLength: 0
                  type: string
                Description:
                  maxLength: 1000
                  minLength: 0
                  type: string
                XpBonus:
                  maximum: 100000
                  minimum: 0
                  pattern: ^-?(?:0|[1-9]\d*)$
                  type:
                    - integer
                    - string
                  format: int32
                IconFile:
                  $ref: "#/components/schemas/IFormFile"
                Rules:
                  maxItems: 1000
                  type: array
                  items:
                    $ref: "#/components/schemas/CreateBadgeRuleDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/BadgeDto"
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeDto"
            text/json:
              schema:
                $ref: "#/components/schemas/BadgeDto"
    get:
      tags:
        - Badges
      summary: GET /api/badges
      description: Gets a paged list of badge definitions.
      parameters:
        - name: SearchTerm
          in: query
          description: Searches badge name and description.
          schema:
            maxLength: 100
            minLength: 0
            type: string
        - name: isEarned
          in: query
          description: Filters badges by whether StudentId has earned them.
          schema:
            type: boolean
        - name: StudentId
          in: query
          description: Student id used together with isEarned.
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
        - name: PageNumber
          in: query
          schema:
            maximum: 2147483647
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: PageSize
          in: query
          schema:
            maximum: 100
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/PagedResponseOfBadgeDto"
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponseOfBadgeDto"
            text/json:
              schema:
                $ref: "#/components/schemas/PagedResponseOfBadgeDto"
  /api/badges/{id}:
    patch:
      tags:
        - Badges
      summary: PATCH /api/badges/{id}
      description: Updates a badge, optional icon, and rule definitions. Admin-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
      requestBody:
        description: Full desired rule set. Existing rules omitted from this list are
          removed.
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                Name:
                  maxLength: 150
                  minLength: 0
                  type: string
                Description:
                  maxLength: 1000
                  minLength: 0
                  type: string
                XpBonus:
                  maximum: 100000
                  minimum: 0
                  pattern: ^-?(?:0|[1-9]\d*)$
                  type:
                    - integer
                    - string
                  format: int32
                NewIconFile:
                  $ref: "#/components/schemas/IFormFile"
                Rules:
                  maxItems: 1000
                  type: array
                  items:
                    $ref: "#/components/schemas/UpdateBadgeRuleDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/BadgeDto"
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeDto"
            text/json:
              schema:
                $ref: "#/components/schemas/BadgeDto"
    delete:
      tags:
        - Badges
      summary: DELETE /api/badges/{id}
      description: Deletes a badge and its icon when the badge is not currently
        awarded. Admin-only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: boolean
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
  /api/badges/{badgeId}/award/{studentId}:
    post:
      tags:
        - Badges
      summary: POST /api/badges/{badgeId}/award/{studentId}
      description: Awards a badge to a student. Admin-only.
      parameters:
        - name: badgeId
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
        - name: studentId
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: boolean
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
  /api/badges/student/{studentId}:
    get:
      tags:
        - Badges
      summary: GET /api/badges/student/{studentId}
      description: Gets badges awarded to a student.
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentBadgeDto"
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentBadgeDto"
            text/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentBadgeDto"
  /api/enrollments:
    get:
      tags:
        - Enrollments
      summary: GET /api/enrollments
      description: "GET /api/enrollments\r

        Searches enrollments. Students are limited to their own enrollments;
        teachers must filter by an owned subject."
      parameters:
        - name: Mark
          in: query
          description: Filters enrollments by exact mark.
          schema:
            maximum: 5
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: StudentId
          in: query
          description: Filters enrollments by student id. Student callers are forced to
            their own id by the service.
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
        - name: SubjectId
          in: query
          description: Filters enrollments by subject id. Teacher callers must use an
            owned subject unless viewing their own enrollment.
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
        - name: IsActive
          in: query
          description: Filters active or archived enrollments. Null leaves archive state
            unfiltered.
          schema:
            type: boolean
        - name: IsDescending
          in: query
          schema:
            type: boolean
        - name: PageNumber
          in: query
          schema:
            maximum: 2147483647
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: PageSize
          in: query
          schema:
            maximum: 100
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/PagedResponseOfEnrollmentDto"
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponseOfEnrollmentDto"
            text/json:
              schema:
                $ref: "#/components/schemas/PagedResponseOfEnrollmentDto"
  /api/enrollments/{id}:
    get:
      tags:
        - Enrollments
      summary: GET /api/enrollments/{id}
      description: "GET /api/enrollments/452\r

        Gets a single enrollment when the requester is the student, the subject
        teacher, or an admin."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/EnrollmentDto"
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentDto"
            text/json:
              schema:
                $ref: "#/components/schemas/EnrollmentDto"
    patch:
      tags:
        - Enrollments
      summary: PATCH /api/enrollments/{id}
      description: "PATCH /api/enrollments/452\r

        Used by admins or subject teachers to grade a student by updating the
        mark."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEnrollmentDto"
          text/json:
            schema:
              $ref: "#/components/schemas/PatchEnrollmentDto"
          application/*+json:
            schema:
              $ref: "#/components/schemas/PatchEnrollmentDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/EnrollmentDto"
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentDto"
            text/json:
              schema:
                $ref: "#/components/schemas/EnrollmentDto"
    delete:
      tags:
        - Enrollments
      summary: DELETE /api/enrollments/{id}
      description: "DELETE /api/enrollments/452\r

        Deletes a specific enrollment. Admins can delete any enrollment;
        students can delete only their own."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: boolean
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
  /api/import/master:
    post:
      tags:
        - Import
      summary: POST /api/import/master
      description: Imports the master CSV file and reports created or skipped records.
        Admin-only.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  $ref: "#/components/schemas/IFormFile"
        required: true
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ImportResultDto"
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResultDto"
            text/json:
              schema:
                $ref: "#/components/schemas/ImportResultDto"
  /api/media-assets:
    get:
      tags:
        - MediaAssets
      summary: GET /api/media-assets
      description: "GET /api/media-assets\r

        Gets a paged list of media asset metadata."
      parameters:
        - name: SearchTerm
          in: query
          description: Searches description and location URL.
          schema:
            maxLength: 100
            minLength: 0
            type: string
        - name: MimeType
          in: query
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: IsPrivate
          in: query
          schema:
            type: boolean
        - name: OwnerId
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
        - name: UnassignedOnly
          in: query
          description: "When true, returns only assets that are not attached to any quiz
            question or quiz option.\r

            Required for bulk unassigned-asset deletion."
          schema:
            type: boolean
        - name: PageNumber
          in: query
          schema:
            maximum: 2147483647
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: PageSize
          in: query
          schema:
            maximum: 100
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/PagedResponseOfMediaAssetDto"
            application/json:
              schema:
                $ref: "#/components/schemas/PagedResponseOfMediaAssetDto"
            text/json:
              schema:
                $ref: "#/components/schemas/PagedResponseOfMediaAssetDto"
    post:
      tags:
        - MediaAssets
      summary: POST /api/media-assets
      description: "POST /api/media-assets\r

        Saves metadata for a new media asset without uploading a file. The owner
        id is taken from the authenticated user."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMediaAssetDto"
          text/json:
            schema:
              $ref: "#/components/schemas/CreateMediaAssetDto"
          application/*+json:
            schema:
              $ref: "#/components/schemas/CreateMediaAssetDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/MediaAssetDto"
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssetDto"
            text/json:
              schema:
                $ref: "#/components/schemas/MediaAssetDto"
    delete:
      tags:
        - MediaAssets
      summary: DELETE /api/media-assets
      description: "DELETE /api/media-assets?unassignedOnly=true\r

        Deletes unassigned media assets. Admins can delete all matching
        unassigned assets; teachers are limited to their own."
      parameters:
        - name: SearchTerm
          in: query
          description: Searches description and location URL.
          schema:
            maxLength: 100
            minLength: 0
            type: string
        - name: MimeType
          in: query
          schema:
            $ref: "#/components/schemas/MediaType"
        - name: IsPrivate
          in: query
          schema:
            type: boolean
        - name: OwnerId
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
        - name: UnassignedOnly
          in: query
          description: "When true, returns only assets that are not attached to any quiz
            question or quiz option.\r

            Required for bulk unassigned-asset deletion."
          schema:
            type: boolean
        - name: PageNumber
          in: query
          schema:
            maximum: 2147483647
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
        - name: PageSize
          in: query
          schema:
            maximum: 100
            minimum: 1
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int32
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                pattern: ^-?(?:0|[1-9]\d*)$
                type:
                  - integer
                  - string
                format: int32
            application/json:
              schema:
                pattern: ^-?(?:0|[1-9]\d*)$
                type:
                  - integer
                  - string
                format: int32
            text/json:
              schema:
                pattern: ^-?(?:0|[1-9]\d*)$
                type:
                  - integer
                  - string
                format: int32
  /api/media-assets/{id}:
    get:
      tags:
        - MediaAssets
      summary: GET /api/media-assets/{id}
      description: "GET /api/media-assets/{id}\r

        Gets media asset metadata by id."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/MediaAssetDto"
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssetDto"
            text/json:
              schema:
                $ref: "#/components/schemas/MediaAssetDto"
    patch:
      tags:
        - MediaAssets
      summary: PATCH /api/media-assets/{id}
      description: "PATCH /api/media-assets/{id}\r

        Updates media asset metadata. Admins can patch any asset; teachers can
        patch only their own assets."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMediaAssetDto"
          text/json:
            schema:
              $ref: "#/components/schemas/PatchMediaAssetDto"
          application/*+json:
            schema:
              $ref: "#/components/schemas/PatchMediaAssetDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/MediaAssetDto"
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAssetDto"
            text/json:
              schema:
                $ref: "#/components/schemas/MediaAssetDto"
    delete:
      tags:
        - MediaAssets
      summary: DELETE /api/media-assets/{id}
      description: "DELETE /api/media-assets/{id}\r

        Deletes the database metadata and physical file. Admins can delete any
        asset; teachers can delete only their own assets."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: boolean
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
  /api/media-assets/{id}/owner:
    patch:
      tags:
        - MediaAssets
      summary: PATCH /api/media-assets/{id}/owner
      description: "PATCH /api/media-assets/{id}/owner\r

        Transfers media asset ownership to another active teacher or admin.
        Admin-only."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignMediaAssetOwnerDto"
          text/json:
            schema:
