              schema:
                $ref: "#/components/schemas/AvatarUploadResponseDto"
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadResponseDto"
            text/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadResponseDto"
components:
  schemas:
    AssignStudentsDto:
      type: object
      properties:
        studentIds:
          maxItems: 1000
          type: array
          items:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
      description: Request containing student ids to assign to a class or subject.
    AttemptStatus:
      enum:
        - Created
        - Started
        - Completed
        - PendingCorrection
        - Abandoned
      description: Lifecycle state of a quiz attempt.
    AvatarUploadResponseDto:
      required:
        - message
        - avatarUrl
      type: object
      properties:
        message:
          type: string
        avatarUrl:
          type: string
      description: Response returned after a successful avatar upload.
    BadgeDto:
      required:
        - id
        - name
        - description
        - iconUrl
        - xpBonus
        - rules
      type: object
      properties:
        id:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Badge identifier.
          format: int64
        name:
          type: string
          description: Badge display name.
        description:
          type: string
          description: Badge description.
        iconUrl:
          type:
            - "null"
            - string
          description: Public icon URL, or null when no icon is assigned.
        xpBonus:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: XP added when the badge is awarded.
          format: int32
        rules:
          type: array
          items:
            $ref: "#/components/schemas/BadgeRuleDto"
          description: Rules attached to this badge.
      description: Badge definition returned by badge endpoints.
    BadgeMetric:
      enum:
        - ScorePercentage
        - TotalScore
        - PerfectAnswersCount
        - TotalAttempts
      description: Metric evaluated by badge rules after quiz attempt completion or grading.
    BadgeOperator:
      enum:
        - Equals
        - GreaterThan
        - GreaterThanOrEqual
        - LessThan
        - LessThanOrEqual
        - NotEquals
      description: Comparison operator used by badge rule evaluation.
    BadgeRuleDto:
      required:
        - id
        - metric
        - operator
        - targetValue
      type: object
      properties:
        id:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          description: Rule identifier.
          format: int64
        metric:
          description: Metric inspected during badge evaluation.
          $ref: "#/components/schemas/BadgeMetric"
        operator:
          description: Comparison operator used against TargetValue.
          $ref: "#/components/schemas/BadgeOperator"
        targetValue:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Value that the selected metric is compared with.
          format: double
      description: Persisted rule that determines when a badge can be awarded.
    BulkEnrollmentResultDto:
      type: object
      properties:
        newlyEnrolledIds:
          type: array
          items:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
          description: Student ids that were newly enrolled by the request.
        alreadyEnrolledIds:
          type: array
          items:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
              - integer
              - string
            format: int64
          description: Student ids that already had an enrollment for the subject.
      description: Result of a bulk enrollment operation, split by newly enrolled and
        already enrolled student ids.
    ClassmateDto:
      type: object
      properties:
        id:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        currentXp:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        avatarUrl:
          type:
            - "null"
            - string
      description: Compact student profile used inside class detail responses.
    CreateBadgeRuleDto:
      type: object
      properties:
        metric:
          description: Metric inspected during badge evaluation.
          $ref: "#/components/schemas/BadgeMetric"
        operator:
          description: Comparison operator used against TargetValue.
          $ref: "#/components/schemas/BadgeOperator"
        targetValue:
          maximum: 1000000
          minimum: 0
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          description: Value that the selected metric is compared with.
          format: double
      description: Request for creating one badge rule.
    CreateMediaAssetDto:
      type: object
      properties:
        locationUrl:
          maxLength: 2048
          minLength: 0
          type: string
        mimeType:
          $ref: "#/components/schemas/MediaType"
        isPrivate:
          type: boolean
        ownerId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int64
        description:
          maxLength: 1000
          minLength: 0
          type:
            - "null"
            - string
      description: Request for creating media asset metadata.
    CreateQuizDto:
      type: object
      properties:
        title:
          maxLength: 150
          minLength: 0
          type: string
        description:
          maxLength: 1000
          minLength: 0
          type: string
        subjectId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int64
        maxRetries:
          maximum: 100
          minimum: 0
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        publishDate:
          type:
            - "null"
            - string
          format: date-time
        closingDate:
          type:
            - "null"
            - string
          format: date-time
      description: Request for creating a quiz with optional UTC publish and closing dates.
    CreateQuizOptionDto:
      type: object
      properties:
        isCorrect:
          type: boolean
        quizQuestionID:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int64
        text:
          maxLength: 4000
          minLength: 0
          type:
            - "null"
            - string
        isFreeText:
          type: boolean
        mediaAssetId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          format: int64
      description: Request for creating a quiz option.
    CreateQuizQuestionDto:
      type: object
      properties:
        title:
          maxLength: 150
          minLength: 0
          type: string
        difficulty:
          maximum: 1000
          minimum: 0
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        timeLimit:
          maximum: 86400
          minimum: 0
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int32
        quizId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - integer
            - string
          format: int64
        hasPenalty:
          type: boolean
        mediaAssetId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          format: int64
        isStrictMultipleChoice:
          type: boolean
      description: Request for creating a quiz question.
    CreateSchoolClassDto:
      type: object
      properties:
        name:
          maxLength: 150
          minLength: 0
          type: string
        academicYear:
          maxLength: 20
          minLength: 0
          type: string
        section:
          maxLength: 20
          minLength: 0
          type: string
        teacherId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - "null"
            - integer
            - string
          description: Optional managing teacher assignment.
          format: int64
      description: Request for creating a school class with an optional managed teacher.
    CreateStudentDto:
      required:
        - role
      type: object
      anyOf:
        - $ref: "#/components/schemas/CreateStudentDtoCreateStudentDto"
        - $ref: "#/components/schemas/CreateStudentDtoCreateTeacherDto"
        - $ref: "#/components/schemas/CreateStudentDtoCreateAdminDto"
      description: Polymorphic user creation DTO; the role discriminator selects
        student, teacher, or admin fields.
      discriminator:
        propertyName: role
        mapping:
          student: "#/components/schemas/CreateStudentDtoCreateStudentDto"
          teacher: "#/components/schemas/CreateStudentDtoCreateTeacherDto"
          admin: "#/components/schemas/CreateStudentDtoCreateAdminDto"
    CreateStudentDtoCreateAdminDto:
      properties:
        role:
          enum:
            - admin
          type: string
        phoneNumber:
          maxLength: 20
          minLength: 0
          pattern: ^00[1-9][0-9]{0,2}[0-9]{7,12}$
          type:
            - "null"
            - string
        department:
          maxLength: 100
          minLength: 0
          pattern: ^[a-zA-Z0-9_
            \-\u00E1\u00E9\u00ED\u00F3\u00FA\u00FD\u010D\u010F\u011B\u0148\u0159\u0161\u0165\u017E\u00C1\u00C9\u00CD\u00D3\u00DA\u00DD\u010C\u010E\u011A\u0147\u0158\u0160\u0164\u017D.,&]+$
          type:
            - "null"
            - string
        managedClassId:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
